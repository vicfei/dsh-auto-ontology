name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: engine syntax
        run: python3 -m py_compile scripts/build_ontology.py scripts/grounding.py scripts/eval_evidence.py scripts/validate_format.py scripts/render_html.py scripts/weknora_bridge.py
      - name: engine contract + fold semantics (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, os, sys, glob
          os.environ["ONTOLOGY_LANG"] = "en"
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("bo", "scripts/build_ontology.py")
          M = importlib.util.module_from_spec(spec); sys.modules["bo"] = M; spec.loader.exec_module(M)
          assert M.tt("en-text", "zh-text") == "en-text" and M.LANG == "en"
          # every committed ontology artifact keeps the evidence contract (v1 + v2 shapes)
          for p in glob.glob("ontologies/*.json"):
              o = json.load(open(p))
              for k in ("domain", "built_at", "tbox", "abox", "stats"):
                  assert k in o, (p, k)
              for r in o["abox"]["relations"]:
                  assert r.get("evidence") or r.get("evidences"), (p, r)
          # fold semantics: append-only evidence, conflict keeps BOTH sides
          st = M.new_store("t")
          M.fold_entity(st, "W", "tool", "q1", "dA")
          M.fold_entity(st, "w", "tool", "q2", "dB")
          M.fold_entity(st, "W", "company", "q3", "dC")
          assert len(st["entities"]) == 1 and len(st["entities"][M._key("W")]["evidences"]) == 2
          assert len(st["conflicts"]) == 1 and set(st["conflicts"][0]["types"]) == {"tool", "company"}
          # coref: alias merges, relations re-pointed
          M.fold_entity(st, "dsh-W", "tool", "q4", "dD")
          M.fold_relation(st, "dsh-W", "hosted_in", "npm", "q5", "dD")
          merged, amap = M.apply_aliases(st, [("W", "dsh-W")])
          assert merged and M._key("dsh-W") not in st["entities"]
          assert any(r["predicate"] == "hosted_in" and r["subject"] == "W" for r in st["relations"].values())
          # name key is script-agnostic (#44): CJK entities fold instead of being silently
          # dropped, CJK relations keep distinct keys, ASCII keys are unchanged
          stc = M.new_store("cjk")
          M.fold_entity(stc, "腾讯", "company", "q1", "dA")
          M.fold_entity(stc, "阿里", "company", "q2", "dB")
          M.fold_entity(stc, "腾讯", "company", "q9", "dZ")
          M.fold_relation(stc, "腾讯", "invests_in", "阿里", "q3", "dC")
          M.fold_relation(stc, "阿里", "invests_in", "字节", "q4", "dD")
          assert len(stc["entities"]) == 2 and len(stc["relations"]) == 2
          assert len(stc["entities"][M._key("腾讯")]["evidences"]) == 2
          oc = M.store_to_ontology(stc, {}, {"model": "m"})
          assert len(M.query_ontology(oc, "腾讯")["relations"]) == 1
          assert M._key("ABox assertions per doc") == "aboxassertionsperdoc" and M._key("W") == "w"
          # a verdict keyed under the old ASCII-only scheme still lands on its entity
          oold = {"tbox": {"entity_types": [{"name": "c", "desc": ""}], "relation_types": []},
                  "abox": {"entities": [], "relations": []},
                  "certifications": {"caf": {"name": "Café", "type": "c", "verdict": "reject", "at": "x", "note": ""}}}
          sto = M.load_store(oold)
          M.fold_entity(sto, "Café", "c", "q", "d")
          assert sto["suppressed"] == 1 and not sto["entities"]
          # append-only across a v1 -> v2 merge + query
          v1 = {"domain": "x", "tbox": {"entity_types": [{"name": "tool", "desc": ""}], "relation_types": []},
                "abox": {"entities": [{"name": "Old", "type": "tool", "evidence": "ev1", "doc": "d0"}], "relations": []}}
          base = M.load_store(v1)
          M.fold_entity(base, "Old", "tool", "ev2", "d1")
          o = M.store_to_ontology(base, {}, {"model": "m"})
          assert len(M.query_ontology(o, "old")["entities"][0]["evidences"]) == 2
          ld = M.to_jsonld(o)
          ids = [n["@id"] for n in ld["@graph"]]
          assert len(ids) == len(set(ids)) and all(i.startswith("urn:dshao:") for i in ids)
          assert ld["@graph"][0]["evidence"], "evidence must stay first-class in JSON-LD"
          md = M.to_markdown(o)
          assert "## Relations" in md and "## Entities" in md and "provenance" in md
          spec2 = importlib.util.spec_from_file_location("rh", "scripts/render_html.py")
          R = importlib.util.module_from_spec(spec2); spec2.loader.exec_module(R)
          html = R.render(md)
          assert "<nav>" in html and "<table>" in html
          spec3 = importlib.util.spec_from_file_location("wb", "scripts/weknora_bridge.py")
          WB = importlib.util.module_from_spec(spec3); spec3.loader.exec_module(WB)
          docs = WB.entity_docs(o)
          assert docs and "Evidence:" in docs[0][1] and len(WB.entity_docs(o, limit=1)) == 1
          cert_o = {"domain": "t", "built_at": "x",
                    "tbox": {"entity_types": [{"name": "tool", "desc": ""}], "relation_types": []},
                    "abox": {"entities": [
                        {"name": "Bad", "type": "tool", "docs": ["d"], "evidences": [{"quote": "q", "doc": "d"}]},
                        {"name": "Good", "type": "tool", "docs": ["d"], "evidences": [{"quote": "g", "doc": "d"}]}],
                     "relations": []}, "conflicts": [], "flagged_unknown_types": [],
                    "stats": {"entities": 2, "relations": 0}}
          o2 = M.certify(cert_o, "Bad", "reject", note="x")
          assert o2["stats"]["entities"] == 1 and o2["certifications"][M._key("bad")]["evidence"]["quote"] == "q"
          st9 = M.load_store(o2)
          M.fold_entity(st9, "Bad", "tool", "q9", "d9")
          M.fold_entity(st9, "Bad", "company", "q8", "d8")
          assert st9["suppressed"] == 1 and st9["entities"][M._key("Bad")]["type"] == "company"
          import copy
          E = lambda n, q: {"name": n, "type": "t", "docs": ["d"], "evidences": [{"quote": q, "doc": "d"}]}
          da = {"abox": {"entities": [E("A", "q1"), E("B", "q2")], "relations": []},
                "conflicts": [], "certifications": {}, "stats": {"entities": 2, "relations": 0}}
          db = copy.deepcopy(da)  # certify mutates in place — diff needs two distinct artifacts
          db["abox"]["entities"].append(E("C", "q3"))
          db["stats"]["entities"] = 3
          dd = M.diff_ontologies(da, db)
          assert dd["entities_added"] == ["C"]
          db2 = M.certify(copy.deepcopy(db), "A", "reject", note="x")
          dd2 = M.diff_ontologies(db, db2)
          assert dd2["entities_removed"] == ["A"] and "certified-reject" in dd2["removal_causes"]["A"]
          spec4 = importlib.util.spec_from_file_location("ev", "scripts/eval_evidence.py")
          EV = importlib.util.module_from_spec(spec4); spec4.loader.exec_module(EV)
          E = lambda n, q: {"name": n, "type": "t", "docs": ["d"], "evidences": [{"quote": q, "doc": "d"}]}
          eo = {"abox": {"entities": [E(f"e{i}", f"q{i}") for i in range(10)],
                         "relations": [{"subject": "e0", "predicate": "p", "object": "e1", "docs": ["d"],
                                        "evidences": [{"quote": "rq", "doc": "d"}]}]}}
          s1, pool1 = EV.sample_assertions(eo, 5, 42)
          s2, _ = EV.sample_assertions(eo, 5, 42)
          assert [x["assertion"] for x in s1] == [x["assertion"] for x in s2] and pool1 == 11
          assert len(EV.sample_assertions(eo, 99, 7)[0]) == 11
          v1e = {"abox": {"entities": [{"name": "A", "type": "t", "evidence": "legacy", "doc": "d0"}], "relations": []}}
          assert EV.sample_assertions(v1e, 5, 1)[0][0]["quote"] == "legacy"
          print("eval sampling: PASS")
          # the shared grounding judge (O5.0, #35): mechanical checks are reject filters only
          import grounding as G
          assert G.name_in_quote("DeepSeek Harness", "runs on **deepseek-harness** today")
          assert not G.name_in_quote("WrenAI", "the Wren layer") and G.name_in_quote("腾讯", "关于腾讯的说明")
          assert G.is_verbatim("a `code` span\n\nwith *marks*", "x a code span with marks y")
          assert not G.is_verbatim("", "x") and not G.is_verbatim("paraphrased", "verbatim only")
          # a quote may span blockquote lines (a list that starts at its label); '>' is markup, not text
          bq = "> Family: [A](u) ·\n> [B](v) · [C](w)\n\n- elsewhere"
          assert G.is_verbatim("Family: [A](u) · [B](v) · [C](w)", bq) and G.is_verbatim("> Family: [A](u) ·\n> [B](v)", bq)
          assert not G.is_verbatim("Family: [C](w)", bq)            # the lines between are not optional
          assert not G.is_verbatim("[A](u) [C](w)", bq)
          assert G.endpoints_in_quote("A", "B", "A -> C") == (True, False)
          v = G.parse_verdicts('```json\n{"verdicts":[{"i":2,"grounded":true,"reason":"ok"}]}\n```', 3)
          assert v == [{"grounded": False, "reason": "no verdict returned"},
                       {"grounded": True, "reason": "ok"},
                       {"grounded": False, "reason": "no verdict returned"}], v
          assert not any(x["grounded"] for x in G.parse_verdicts("not json", 2))
          assert not any(x["grounded"] for x in G.parse_verdicts('{"verdicts":[{"i":9,"grounded":true}]}', 2))
          # strict booleans: "false", 1, null, "maybe" never pass as truthy
          sv = G.parse_verdicts('{"verdicts":[{"i":1,"grounded":"false"},{"i":2,"grounded":"true"},'
                                '{"i":3,"grounded":1},{"i":4,"grounded":null},{"i":5,"grounded":"maybe"}]}', 5)
          assert [x["grounded"] for x in sv] == [False, True, False, False, False], sv
          msg = G.judge_user_message([
              {"kind": "entity", "type_name": "t", "type_desc": "a thing", "claim": "X is a t.", "quote": "q", "doc": "d"},
              {"kind": "relation", "type_name": "p", "type_desc": "", "claim": "X p Y.", "quote": "r", "doc": "e"}])
          assert "Type definitions:\n- t: a thing" in msg and "1. CLAIM: X is a t. (a thing)" in msg
          assert '2. CLAIM: X p Y.\n   QUOTE [e]: "r"' in msg
          # adversarial gold: both labels present, and the relaxed name rule pinned from both sides —
          # a grounded case whose quote does NOT spell the name, and a quote about ANOTHER
          # instance of the type that must still be rejected
          cases = EV.load_cases()
          assert len(cases) >= 20 and any(c["grounded"] for c in cases) and any(not c["grounded"] for c in cases)
          for c in cases:
              assert {"id", "grounded", "kind", "quote", "why"} <= set(c), c
          byid = {c["id"]: c for c in cases}
          assert not EV.case_mechanical(byid["alias-label"])["name_in_quote"] and byid["alias-label"]["grounded"]
          assert not EV.case_mechanical(byid["substituted-instance"])["name_in_quote"]
          assert not byid["substituted-instance"]["grounded"]
          # eval v2: whole population, build-time flags carried onto the sampled row, no-LLM rates
          assert len(EV.sample_assertions(eo, 0, 1)[0]) == 11
          flagged = {"abox": {"entities": [dict(E("F", "q"), type_grounding=False)], "relations": []}}
          assert EV.sample_assertions(flagged, 0, 1)[0][0]["flag"] is False
          mr = EV.mechanical_rates({"abox": {
              "entities": [E("e0", "e0 is here")],
              "relations": [{"subject": "s", "predicate": "p", "object": "o",
                             "evidences": [{"quote": "o thing", "doc": "d"}]}]}})
          assert mr == {"entities": {"n": 1, "name_in_quote": 1},
                        "relations": {"n": 1, "one_endpoint": 1, "both_endpoints": 0}}, mr
          print("grounding judge + adversarial gold + eval v2: PASS")
          # O5.0 grounding pass (#35): flag never drop, verdicts are append-only, strongest quote first
          sg = M.new_store("g")
          sg["tbox_types"] |= {"tool", "company"}
          M.fold_entity(sg, "W", "tool", "see also W", "dA", grounded=False, reason="mention only")
          M.fold_entity(sg, "W", "tool", "W is a tool.", "dB", grounded=True)
          assert [e["grounded"] for e in M._strongest(sg["entities"]["w"]["evidences"])] == [True, False]
          assert sg["entities"]["w"]["evidences"][0]["quote"] == "see also W"   # fold order untouched in the store
          M.fold_entity(sg, "W", "tool", "W again", "dC")                       # never judged
          assert M._flag(sg["entities"]["w"]["evidences"]) is True              # any grounded quote grounds the claim
          M.fold_entity(sg, "U", "tool", "and U too", "dA", grounded=False)
          M.fold_entity(sg, "U", "company", "U mentioned", "dB", grounded=False)  # an ungrounded challenger is no conflict
          assert not sg["conflicts"] and len(sg["flagged_ungrounded"]) == 1
          M.fold_entity(sg, "U", "company", "U mentioned", "dC", grounded=False)  # same challenge, same quote: once
          assert len(sg["flagged_ungrounded"]) == 1
          M.fold_entity(sg, "U", "company", "U is a company", "dC", grounded=True)
          assert len(sg["conflicts"]) == 1 and sg["conflicts"][0]["types"]["company"]["grounded"] is True
          M.fold_relation(sg, "W", "uses", "U", "W uses U", "dA", grounded=True)
          M.fold_relation(sg, "W", "uses", "U", "W and U", "dB", grounded=False)
          og = M.store_to_ontology(sg, {}, {"model": "m"})
          W, U = M.query_ontology(og, "W")["entities"][0], M.query_ontology(og, "u")["entities"][0]
          assert W["type_grounding"] is True and U["type_grounding"] is False     # flagged, never dropped
          assert W["evidences"][0]["quote"] == "W is a tool." and W["evidences"][-1]["grounded"] is False
          assert W["evidences"][-1].get("reason") == "mention only" and U["evidences"][0]["quote"] == "and U too"
          R = M.query_ontology(og, "W")["relations"][0]
          assert R["grounding"] is True and R["evidences"][0]["grounded"] is True
          stt = og["stats"]
          assert (stt["entities_grounded"], stt["entities_ungrounded"], stt["relations_grounded"],
                  stt["relations_ungrounded"], stt["ungrounded_type_clashes"]) == (1, 1, 1, 0, 1)
          mdg = M.to_markdown(og)
          assert "**W** ✓" in mdg and "**U** ⚠" in mdg and "Ungrounded type clashes" in mdg
          ldg = M.to_jsonld(og)
          assert [n.get("type_grounding") for n in ldg["@graph"] if n["@id"].endswith(":w")] == [True]
          bd = dict(WB.entity_docs(og))["Ontology: U (tool)"]
          assert "Type claim: NOT grounded" in bd and "ungrounded" in bd
          # a certification rebuild keeps every derived flag; the actor travels with the verdict
          oc = M.certify(json.loads(json.dumps(og)), "W", "reject", note="x", actor="agent:x")
          assert M.query_ontology(oc, "U")["entities"][0]["type_grounding"] is False
          assert oc["certifications"]["w"]["actor"] == "agent:x"
          assert oc["certifications"]["w"]["evidence"]["grounded"] is True      # the strongest quote is cited
          # reload: verdicts and clashes survive a round trip; a flagged-only writer keeps its verdict
          stg = M.load_store(og)
          assert M._flag(stg["entities"]["w"]["evidences"]) is True and len(stg["flagged_ungrounded"]) == 1
          ow = {"abox": {"entities": [dict(E("F", "q"), type_grounding=False)], "relations": []}}
          assert M._flag(M.load_store(ow)["entities"]["f"]["evidences"]) is False
          # the verbatim gate (no LLM): the ONE hard reject — the judge never sees the document.
          # A missing name or endpoint is the judge's call, not a pre-reject.
          doc = {"path": "d1", "text": "WrenAI is a semantic layer.\nIt mentions X in passing.\nWrenAI runs on WeKnora.\n"
                                        "Zed is a tool for exports."}
          out = {"entities": [{"name": "WrenAI", "type": "t", "evidence": "WrenAI is a semantic layer."},
                              {"name": "X", "type": "t", "evidence": "It mentions X in passing."},
                              {"name": "Y", "type": "t", "evidence": "It mentions X in passing."},
                              {"name": "Ghost", "type": "t", "evidence": "Ghost is a hallucinated tool."},
                              {"name": "Zed", "type": "t", "evidence": "Zed is a tool for exports."}],
                 "relations": [{"subject": "WrenAI", "predicate": "runs_on", "object": "WeKnora",
                                "evidence": "WrenAI runs on WeKnora."}]}
          assert M._reject_reason(out["entities"][0], doc["text"]) is None
          assert M._reject_reason(out["entities"][1], doc["text"]) is None   # the name IS in the quote
          assert M._reject_reason(out["entities"][2], doc["text"]) is None   # the name is absent: judged anyway
          assert "not verbatim" in M._reject_reason(out["entities"][3], doc["text"])
          assert M._reject_reason(out["entities"][4], doc["text"]) is None
          assert M._reject_reason(out["relations"][0], doc["text"]) is None
          # the pass itself, judge stubbed (no network): ONE judge call per assertion — the eval's
          # protocol, run concurrently — plus one re-ground; no re-judge without a repair
          import re as _re
          calls = []
          def stub(sysmsg, user, json_out=True, model=None):
              calls.append(("reground" if "repairs" in sysmsg else "judge", user, model))
              if "repairs" in sysmsg:
                  return {"repairs": [{"i": 1, "quote": None}]}
              q = _re.search(r"QUOTE \[[^\]]*\]: (.*)", user).group(1)
              return {"verdicts": [{"i": 1, "grounded": " is a " in q or " runs on " in q, "reason": "stub"}]}
          M.llm, M.JUDGE_MODEL = stub, "judge-x"
          g = M.ground_doc(doc, out, {"t"}, {"t": "a thing"})
          assert [e["grounded"] for e in out["entities"]] == [True, False, False, False, True], out
          assert out["entities"][1]["judge_reason"] == "stub"            # judged: mention-only is the judge's call
          assert out["entities"][2]["judge_reason"] == "stub"            # no name rule: the judge rejected it
          assert "not verbatim" in out["entities"][3]["judge_reason"]
          assert out["relations"][0]["grounded"] is True
          judged = [u for kind, u, _m in calls if kind == "judge"]
          assert all(u.count("CLAIM:") == 1 for u in judged) and len(judged) == 5, judged   # never a batch
          assert g == {"entities": [2, 3], "relations": [1, 0], "regrounded": 0} and len(calls) == 6, (g, calls)
          # --judge-model reaches the judge calls (and only them): the provenance never names a judge that did not judge
          assert [m for kind, _u, m in calls if kind == "judge"] == ["judge-x"] * 5, calls
          assert [m for kind, _u, m in calls if kind == "reground"] == [None], calls
          def stub2(sysmsg, user, json_out=True, model=None):
              if "repairs" in sysmsg:
                  return {"repairs": [{"i": 1, "quote": "Y is a tool for X."}]}
              return {"verdicts": [{"i": 1, "grounded": " is a " in _re.search(r"QUOTE \[[^\]]*\]: (.*)", user).group(1),
                                    "reason": "stub"}]}
          M.llm = stub2
          out2 = {"entities": [{"name": "Y", "type": "tool", "evidence": "Y is mentioned."}], "relations": []}
          g2 = M.ground_doc({"path": "d2", "text": "Y is mentioned. Y is a tool for X."}, out2, {"tool"}, {"tool": "a thing"})
          assert g2["regrounded"] == 1 and out2["entities"][0]["grounded"] is True
          assert out2["entities"][0]["evidence"] == "Y is a tool for X."
          out3 = {"entities": [{"name": "Y", "type": "tool", "evidence": "Y is mentioned."}], "relations": []}
          M.ground_doc({"path": "d3", "text": "Y is mentioned."}, out3, {"tool"}, {"tool": "a thing"}, reground=False)
          assert out3["entities"][0]["grounded"] is False
          # the cost guard is exact under concurrency: 10 concurrent judge calls under a cap of 3
          # reserve exactly 3 — the 4th..10th never reach the API (fresh module: real llm, stubbed API)
          specb = importlib.util.spec_from_file_location("bo2", "scripts/build_ontology.py")
          B2 = importlib.util.module_from_spec(specb); specb.loader.exec_module(B2)
          B2.MAX_CALLS, B2.COST["calls"] = 3, 0
          _real_complete = G.complete
          B2.grounding.complete = lambda model, messages, json_out=True, account=None: (
              {"verdicts": [{"i": 1, "grounded": True, "reason": "stub"}]}, {})
          many = [("entity", {"name": f"e{i}", "type": "tool", "evidence": f"e{i} is mentioned."}) for i in range(10)]
          try:
              B2._judge(many, "d", {"tool": "a thing"})
              raise AssertionError("the cost guard did not trip")
          except SystemExit:
              pass
          assert B2.COST["calls"] == 3, B2.COST
          # under the cap the same ten run: one call each, verdicts in the input order, every call counted
          B2.MAX_CALLS, B2.COST["calls"] = None, 0
          vs10 = B2._judge(many, "d", {"tool": "a thing"})
          assert [v["grounded"] for v in vs10] == [True] * 10 and B2.COST["calls"] == 10
          G.complete = _real_complete                      # B2 shares the module: unstub it for whatever runs next
          # the v0.2 validator: the artifact passes, and it bites on a flag its evidences contradict
          spec5 = importlib.util.spec_from_file_location("vf", "scripts/validate_format.py")
          VF = importlib.util.module_from_spec(spec5); spec5.loader.exec_module(VF)
          assert not VF.validate(og), VF.validate(og)
          for mutate in (lambda a: a["abox"]["entities"][0].__setitem__("type_grounding", "yes"),
                         lambda a: a["abox"]["entities"][1].__setitem__("type_grounding", False),
                         lambda a: a["abox"]["entities"][0]["evidences"][0].__setitem__("grounded", 1),
                         lambda a: a["flagged_ungrounded"].append({"entity": "Z"})):
              bad = json.loads(json.dumps(og))
              mutate(bad)
              assert VF.validate(bad), mutate
          print("grounding pass (flag never drop) + format v0.2: PASS")
          EOF
      - name: committed artifacts conform to the format
        run: python3 scripts/validate_format.py ontologies/*.json
      - name: committed SVGs keep the title and every label on the canvas
        run: |
          python3 - <<'EOF'
          import glob, re, sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "scripts")
          import build_ontology as M
          ns = "{http://www.w3.org/2000/svg}"
          for p in sorted(glob.glob("ontologies/*.svg")):
              root = ET.parse(p).getroot()
              W, H = float(root.get("width")), float(root.get("height"))
              checked = 0
              for el in root:
                  m = re.search(r"translate\(([-\d.]+)[ ,]+([-\d.]+)\)", el.get("transform") or "")
                  dx, dy = (float(m.group(1)), float(m.group(2))) if m else (0.0, 0.0)
                  for t in ([el] if el.tag == ns + "text" else el.iter(ns + "text")):
                      x, y, fs = float(t.get("x")) + dx, float(t.get("y")) + dy, float(t.get("font-size", 9))
                      right = x + M._text_w(t.text or "", fs)
                      assert 0 <= x and right <= W and 0 <= y - fs and y <= H, (p, t.text, x, y, right, W, H)
                      checked += 1
              assert checked >= 2, p          # the title is two lines even for an empty graph
          print("committed SVGs: title and labels on the canvas")
          EOF
      - name: bin entry syntax (node --check)
        run: node --check npm/bin/auto-ontology.js
      # --dry-run lists the bundle and writes no tarball — nothing to clean up, and a wildcard rm
      # inside the package directory would delete any tarball kept there
      - name: npm bundle packs clean
        run: cd npm && npm pack --dry-run
      # LLM build smoke goes manual dispatch (needs DEEPSEEK_API_KEY secret)
      - name: build smoke (needs secret, dispatch only)
        if: github.event_name == 'workflow_dispatch' && env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          grep -q '^export DEEPSEEK_API_KEY=' ~/.bashrc || echo "export DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> ~/.bashrc
          mkdir -p /tmp/corpus && head -c 2000 README.md > /tmp/corpus/a.md
          timeout 200 python3 scripts/build_ontology.py --docs /tmp/corpus --domain "CI smoke" 2>&1 | grep -q "Ontology build"
