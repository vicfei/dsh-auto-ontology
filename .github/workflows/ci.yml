name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: engine syntax
        run: python3 -m py_compile scripts/build_ontology.py
      - name: engine contract + fold semantics (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, os, sys, glob
          os.environ["ONTOLOGY_LANG"] = "en"
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("bo", "scripts/build_ontology.py")
          M = importlib.util.module_from_spec(spec); sys.modules["bo"] = M; spec.loader.exec_module(M)
          assert M.tt("en-text", "zh-text") == "en-text" and M.LANG == "en"
          # every committed ontology artifact keeps the evidence contract (v1 + v2 shapes)
          for p in glob.glob("ontologies/*.json"):
              o = json.load(open(p))
              for k in ("domain", "built_at", "tbox", "abox", "stats"):
                  assert k in o, (p, k)
              for r in o["abox"]["relations"]:
                  assert r.get("evidence") or r.get("evidences"), (p, r)
          # fold semantics: append-only evidence, conflict keeps BOTH sides
          st = M.new_store("t")
          M.fold_entity(st, "W", "tool", "q1", "dA")
          M.fold_entity(st, "w", "tool", "q2", "dB")
          M.fold_entity(st, "W", "company", "q3", "dC")
          assert len(st["entities"]) == 1 and len(st["entities"][M._key("W")]["evidences"]) == 2
          assert len(st["conflicts"]) == 1 and set(st["conflicts"][0]["types"]) == {"tool", "company"}
          # coref: alias merges, relations re-pointed
          M.fold_entity(st, "dsh-W", "tool", "q4", "dD")
          M.fold_relation(st, "dsh-W", "hosted_in", "npm", "q5", "dD")
          merged, amap = M.apply_aliases(st, [("W", "dsh-W")])
          assert merged and M._key("dsh-W") not in st["entities"]
          assert any(r["predicate"] == "hosted_in" and r["subject"] == "W" for r in st["relations"].values())
          # append-only across a v1 -> v2 merge + query
          v1 = {"domain": "x", "tbox": {"entity_types": [{"name": "tool", "desc": ""}], "relation_types": []},
                "abox": {"entities": [{"name": "Old", "type": "tool", "evidence": "ev1", "doc": "d0"}], "relations": []}}
          base = M.load_store(v1)
          M.fold_entity(base, "Old", "tool", "ev2", "d1")
          o = M.store_to_ontology(base, {}, {"model": "m"})
          assert len(M.query_ontology(o, "old")["entities"][0]["evidences"]) == 2
          ld = M.to_jsonld(o)
          ids = [n["@id"] for n in ld["@graph"]]
          assert len(ids) == len(set(ids)) and all(i.startswith("urn:dshao:") for i in ids)
          assert ld["@graph"][0]["evidence"], "evidence must stay first-class in JSON-LD"
          md = M.to_markdown(o)
          assert "## Relations" in md and "## Entities" in md and "provenance" in md
          spec2 = importlib.util.spec_from_file_location("rh", "scripts/render_html.py")
          R = importlib.util.module_from_spec(spec2); spec2.loader.exec_module(R)
          html = R.render(md)
          assert "<nav>" in html and "<table>" in html
          spec3 = importlib.util.spec_from_file_location("wb", "scripts/weknora_bridge.py")
          WB = importlib.util.module_from_spec(spec3); spec3.loader.exec_module(WB)
          docs = WB.entity_docs(o)
          assert docs and "Evidence:" in docs[0][1] and len(WB.entity_docs(o, limit=1)) == 1
          cert_o = {"domain": "t", "built_at": "x",
                    "tbox": {"entity_types": [{"name": "tool", "desc": ""}], "relation_types": []},
                    "abox": {"entities": [
                        {"name": "Bad", "type": "tool", "docs": ["d"], "evidences": [{"quote": "q", "doc": "d"}]},
                        {"name": "Good", "type": "tool", "docs": ["d"], "evidences": [{"quote": "g", "doc": "d"}]}],
                     "relations": []}, "conflicts": [], "flagged_unknown_types": [],
                    "stats": {"entities": 2, "relations": 0}}
          o2 = M.certify(cert_o, "Bad", "reject", note="x")
          assert o2["stats"]["entities"] == 1 and o2["certifications"][M._key("bad")]["evidence"]["quote"] == "q"
          st9 = M.load_store(o2)
          M.fold_entity(st9, "Bad", "tool", "q9", "d9")
          M.fold_entity(st9, "Bad", "company", "q8", "d8")
          assert st9["suppressed"] == 1 and st9["entities"][M._key("Bad")]["type"] == "company"
          print("certify fold-back: PASS")
          EOF
      - name: bin entry syntax (node --check)
        run: node --check npm/bin/auto-ontology.js
      - name: npm bundle packs clean
        run: cd npm && npm pack --dry-run && rm -f *.tgz
      # LLM build smoke goes manual dispatch (needs DEEPSEEK_API_KEY secret)
      - name: build smoke (needs secret, dispatch only)
        if: github.event_name == 'workflow_dispatch' && env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          grep -q '^export DEEPSEEK_API_KEY=' ~/.bashrc || echo "export DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> ~/.bashrc
          mkdir -p /tmp/corpus && head -c 2000 README.md > /tmp/corpus/a.md
          timeout 200 python3 scripts/build_ontology.py --docs /tmp/corpus --domain "CI smoke" 2>&1 | grep -q "Ontology build"
